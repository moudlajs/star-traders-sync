name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # macOS: the tool is macOS-only until #1, and it depends on BSD
    # behaviour (stat -f, BSD find, openrsync, cpio). Linux runners would
    # pass while the real target broke.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          for f in bin/star-traders-sync install.sh tests/regression.sh; do
            /bin/bash -n "$f" && echo "ok   $f"
          done

      - name: Runs under bash 3.2 (what macOS actually ships)
        run: |
          /bin/bash --version | head -1
          /bin/bash bin/star-traders-sync --version
          /bin/bash bin/star-traders-sync --help > /dev/null

      - name: No bash 4+ features
        run: |
          # These would work on the runner's newer bash but fail on a real Mac.
          # Comments are stripped first, so a comment naming a forbidden
          # construct does not trip the check.
          for f in bin/star-traders-sync install.sh tests/regression.sh; do
            if sed 's/[[:space:]]*#.*$//' "$f" \
               | grep -nE '\$\{[A-Za-z_]+\^\^|\$\{[A-Za-z_]+,,|mapfile |readarray |declare -A|local -A|&>>|\|&'; then
              echo "bash 4+ feature in $f - macOS ships bash 3.2"; exit 1
            fi
          done
          echo "ok - none found"

      - name: config.example documents exactly the keys the script accepts
        run: |
          grep -oE '^[A-Z_]+' config.example | sort -u > /tmp/documented
          sed -n '/^config_key_known/,/^}/p' bin/star-traders-sync \
            | grep -oE '[A-Z][A-Z_]+' | sort -u > /tmp/accepted
          if ! diff -u /tmp/documented /tmp/accepted; then
            echo "config.example and the key whitelist disagree"; exit 1
          fi
          echo "ok - $(wc -l < /tmp/accepted | tr -d ' ') keys match"

      - name: Every exit code in the script is documented
        run: |
          grep -oE '^readonly EX_[A-Z_]+=[0-9]+' bin/star-traders-sync \
            | grep -oE '[0-9]+$' | sort -un > /tmp/codes
          missing=0
          while read -r c; do
            grep -qE "^\| $c \|" README.md || { echo "exit code $c not in README table"; missing=1; }
          done < /tmp/codes
          [ "$missing" -eq 0 ] && echo "ok - all documented"
          exit $missing

      - name: Regression suite
        run: ./tests/regression.sh -v

  shellcheck:
    runs-on: ubuntu-latest
    # Advisory for now: the script predates shellcheck and has a backlog.
    # Kept visible rather than silenced, and not a merge gate yet - see #4.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck --shell=bash --severity=warning \
            bin/star-traders-sync install.sh tests/regression.sh || true
