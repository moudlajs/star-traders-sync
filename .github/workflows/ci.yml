name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # macOS: the tool is macOS-only until #1, and it depends on BSD
    # behaviour (stat -f, BSD find, openrsync, cpio). Linux runners would
    # pass while the real target broke.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          for f in bin/star-traders-sync install.sh tests/regression.sh; do
            /bin/bash -n "$f" && echo "ok   $f"
          done

      - name: Runs under bash 3.2 (what macOS actually ships)
        run: |
          /bin/bash --version | head -1
          /bin/bash bin/star-traders-sync --version
          /bin/bash bin/star-traders-sync --help > /dev/null

      - name: No bash 4+ features
        run: |
          # These would work on the runner's newer bash but fail on a real Mac.
          # Comments are stripped first, so a comment naming a forbidden
          # construct does not trip the check.
          for f in bin/star-traders-sync install.sh tests/regression.sh; do
            if sed 's/[[:space:]]*#.*$//' "$f" \
               | grep -nE '\$\{[A-Za-z_]+\^\^|\$\{[A-Za-z_]+,,|mapfile |readarray |declare -A|local -A|&>>|\|&'; then
              echo "bash 4+ feature in $f - macOS ships bash 3.2"; exit 1
            fi
          done
          echo "ok - none found"

      - name: config.example documents exactly the keys the script accepts
        run: |
          grep -oE '^[A-Z_]+' config.example | sort -u > /tmp/documented
          sed -n '/^config_key_known/,/^}/p' bin/star-traders-sync \
            | grep -oE '[A-Z][A-Z_]+' | sort -u > /tmp/accepted
          if ! diff -u /tmp/documented /tmp/accepted; then
            echo "config.example and the key whitelist disagree"; exit 1
          fi
          echo "ok - $(wc -l < /tmp/accepted | tr -d ' ') keys match"

      - name: Every exit code in the script is documented
        run: |
          # The table lives in docs/troubleshooting.md. If it moves again,
          # this path must move with it or the check silently passes on
          # nothing.
          TABLE=docs/troubleshooting.md
          [ -f "$TABLE" ] || { echo "$TABLE is missing"; exit 1; }
          grep -oE '^readonly EX_[A-Z_]+=[0-9]+' bin/star-traders-sync \
            | grep -oE '[0-9]+$' | sort -un > /tmp/codes
          [ -s /tmp/codes ] || { echo "found no exit codes to check"; exit 1; }
          # --help lists them too (the script's header promises it, and
          # 65 once shipped without it).
          bin/star-traders-sync --help > /tmp/help
          missing=0
          while read -r c; do
            grep -qE "^\| $c \|" "$TABLE" || { echo "exit code $c not in $TABLE"; missing=1; }
            grep -qE "^  $c +[^ ]" /tmp/help || { echo "exit code $c not in --help"; missing=1; }
          done < /tmp/codes
          [ "$missing" -eq 0 ] && echo "ok - $(wc -l < /tmp/codes | tr -d ' ') codes documented"
          exit $missing

      - name: Regression suite
        run: ./tests/regression.sh -v

  go:
    # The Go build (v2.0, #19). Not shipped until #26: until then it is
    # held to the bash script, which stays the reference, by parity.sh.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          [ -z "$out" ] || { echo "not gofmt-ed:"; echo "$out"; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./...

      - name: Parity with the bash script
        run: tests/parity.sh

  setup-app:
    # The macOS app (macos/). Builds the real universal .app and .dmg,
    # not just the package, so a packaging break shows up here rather than
    # on release day. Its tests include one that runs the script's own
    # validator against the config the app writes.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        run: swift test --package-path macos

      - name: Build the .app and .dmg
        run: macos/build-app.sh

  conventions:
    # PR title becomes the squash commit subject, so it is the thing that
    # actually has to follow Conventional Commits. Branch naming is checked
    # alongside it. Both are documented in CONTRIBUTING.md.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: PR title follows Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "title: $TITLE"
          if ! printf '%s' "$TITLE" | grep -qE '^(feat|fix|docs|test|ci|refactor|perf|chore|build|revert)(\([a-z0-9-]+\))?!?: .+'; then
            cat <<'MSG'
          PR title must follow Conventional Commits, because it becomes the
          squash commit subject on main.

            <type>(<optional scope>): <subject>

          Types: feat fix docs test ci refactor perf chore build revert
          Scopes used here: sync lock backup snapshot config play

          Examples:
            fix(lock): release the hub lock on every early return
            feat(backup): mark completed backups
            docs: cut config.example from 190 lines to 97
          MSG
            exit 1
          fi
          echo "ok"

      - name: Branch name follows the convention
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          echo "branch: $BRANCH"
          if ! printf '%s' "$BRANCH" | grep -qE '^(feat|fix|hotfix|docs|test|ci|refactor|chore|infra|release)/[a-z0-9._-]+$'; then
            cat <<'MSG'
          Branch must be <type>/<short-description>, lowercase.

          Allowed: feat fix hotfix docs test ci refactor chore infra release

          Examples:
            fix/hub-lock-leak
            feat/sts-update
            infra/ci-and-release
          MSG
            exit 1
          fi
          echo "ok"

  shellcheck:
    runs-on: ubuntu-latest
    # Advisory for now: the script predates shellcheck and has a backlog.
    # Kept visible rather than silenced, and not a merge gate yet - see #4.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck --shell=bash --severity=warning \
            bin/star-traders-sync install.sh tests/regression.sh || true
