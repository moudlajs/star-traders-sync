name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag must match STS_VERSION in the script
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(grep -oE '^readonly STS_VERSION="[^"]+"' bin/star-traders-sync \
                 | cut -d'"' -f2)"
          echo "tag=$tag  STS_VERSION=$ver"
          [ "$tag" = "$ver" ] || {
            echo "tag and STS_VERSION disagree - bump one of them"; exit 1; }

      - name: CHANGELOG must have a section for this tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          grep -qE "^## \[${tag//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md || {
            echo "CHANGELOG.md has no '## [$tag] - <date>' section."
            echo "A release with no entry is how this file went missing for"
            echo "six releases. Move Unreleased into a [$tag] section first."
            exit 1; }

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Regression suite must pass before a release exists
        run: ./tests/regression.sh

      - name: And the Go build it ships must pass it too, and match the script (#175)
        run: |
          go build -o "$RUNNER_TEMP/sts-go" ./cmd/sts
          STS_BIN="$RUNNER_TEMP/sts-go" ./tests/regression.sh
          STS_GO="$RUNNER_TEMP/sts-go" tests/parity.sh

      - name: Build the app
        run: |
          swift test --package-path macos
          macos/build-app.sh

      - name: Sign the dmg (#108)
        env:
          STS_RELEASE_SIGNING_KEY: ${{ secrets.STS_RELEASE_SIGNING_KEY }}
        run: |
          dmg=macos/build/Star-Traders-Sync.dmg
          swift macos/scripts/release-sign.swift sign "$dmg" > "$dmg.sig"
          # Verify against the app's built-in key, not the secret: a mismatch would ship a release no app accepts.
          pub="$(grep -oE 'publicKeyBase64 = "[^"]+"' macos/Sources/STSSetupCore/Updater.swift | cut -d'"' -f2 || true)"
          [ -n "$pub" ] || { echo "no public key found in Updater.swift"; exit 1; }
          swift macos/scripts/release-sign.swift verify "$dmg" "$dmg.sig" "$pub"

      - name: The Go build, on its own, signed (#175)
        env:
          STS_RELEASE_SIGNING_KEY: ${{ secrets.STS_RELEASE_SIGNING_KEY }}
        run: |
          bin=macos/build/star-traders-sync-go-darwin-universal
          cp "macos/build/Star Traders Sync.app/Contents/Resources/star-traders-sync-go" "$bin"
          (cd macos/build && shasum -a 256 "$(basename "$bin")" > "$(basename "$bin").sha256")
          swift macos/scripts/release-sign.swift sign "$bin" > "$bin.sig"
          pub="$(grep -oE 'publicKeyBase64 = "[^"]+"' macos/Sources/STSSetupCore/Updater.swift | cut -d'"' -f2 || true)"
          swift macos/scripts/release-sign.swift verify "$bin" "$bin.sig" "$pub"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --generate-notes \
            --title "$GITHUB_REF_NAME" \
            bin/star-traders-sync \
            install.sh \
            config.example \
            macos/build/Star-Traders-Sync.dmg \
            macos/build/Star-Traders-Sync.dmg.sig \
            macos/build/star-traders-sync-go-darwin-universal \
            macos/build/star-traders-sync-go-darwin-universal.sha256 \
            macos/build/star-traders-sync-go-darwin-universal.sig
